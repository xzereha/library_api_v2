spring:
    application:
        name: library_api
    data:
        redis:
            host: ${SPRING_REDIS_HOST:localhost}
            port: ${SPRING_REDIS_PORT:6379}
            timeout: 2000ms
            connect-timeout: 2000ms
            repositories:
                enabled: false
    config:
        import: optional:vault://
    cloud:
        vault:
            uri: ${VAULT_ADDR:http://127.0.0.1:8200}
            token: ${VAULT_TOKEN}
            kv:
                enabled: true
    datasource:
        url: jdbc:h2:mem:testdb
        driverClassName: org.h2.Driver
        username: sa
        password:
    h2:
        console:
            enabled: true
            path: /h2-console
    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        hibernate:
            ddl-auto: create
        show-sql: false
        defer-datasource-initialization: true
    sql:
        init:
            mode: always

library:
    rate-limit:
        default-capacity: 100
        default-refill-per-minute: 60
        endpoints:
            books:
                capacity: 50
                refill-per-minute: 30
            authors:
                capacity: 40
                refill-per-minute: 20
            loans:
                capacity: 30
                refill-per-minute: 10

springdoc:
    api-docs:
        path: /api-docs
    swagger-ui:
        path: /swagger-ui.html
        enabled: true
