spring:
    application:
        name: library_api
    config:
        import: optional:vault://
    cloud:
        vault:
            uri: http://127.0.0.1:8200
            token: ${VAULT_TOKEN}
            kv:
                enabled: true
    datasource:
        url: jdbc:h2:mem:testdb
        driverClassName: org.h2.Driver
        username: sa
        password:
    h2:
        console:
            enabled: true
            path: /h2-console
    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        hibernate:
            ddl-auto: create
        show-sql: true
        defer-datasource-initialization: true
    sql:
        init:
            mode: always

springdoc:
    api-docs:
        path: /api-docs
    swagger-ui:
        path: /swagger-ui.html
        enabled: true
